[project]
name = "risk-sentinel"
version = "0.1.0"
description = "Rule-based risk agent for a paper book: concentration, drawdown, and cash. Not financial advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aziz Rehman" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/aziz4rehman-hue/risk-sentinel"

[project.scripts]
risksentinel = "risksentinel.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["risksentinel*"]
